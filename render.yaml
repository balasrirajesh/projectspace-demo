services:
  # ─────────────────────────────────────────────────────────────────────────────
  # GraduWay WebRTC Signaling & REST Backend
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: graduway-backend
    env: node
    plan: free
    rootDir: signaling_server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: START_MEDIA_SERVER
        value: "false"
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas connection string in Render Dashboard

  # ─────────────────────────────────────────────────────────────────────────────
  # GraduWay Flutter Web Client (Static Site with SPA Routing)
  # ─────────────────────────────────────────────────────────────────────────────
  - type: web
    name: graduway-web
    env: static
    buildCommand: flutter/bin/flutter build web --release || echo "Deploying pre-built web assets"
    staticPublishPath: build/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: SIGNALING_URL
        fromService:
          type: web
          name: graduway-backend
          property: host
